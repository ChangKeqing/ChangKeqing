name: A-share quant paper trading

on:
  schedule:
    - cron: "40 7 * * 1-5"   # 15:40 Beijing time, after the A-share close
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: ashare-quant
  cancel-in-progress: false

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ashare_quant/requirements.txt
      - run: pip install -r ashare_quant/requirements.txt
      - name: Daily step
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
          LLM_BUDGET_USD: ${{ vars.LLM_BUDGET_USD }}
        run: python -m ashare_quant.run
      - name: Save state
        run: |
          git config user.name "ashare-quant-bot"
          git config user.email "actions@users.noreply.github.com"
          git add ashare_quant/state ashare_quant/report.md
          git diff --cached --quiet || git commit -m "quant: daily paper-trading update"
          git push
      - name: Stop the schedule once API credit is used up
        if: hashFiles('ashare_quant/state/HALTED') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow disable ashare-quant.yml
